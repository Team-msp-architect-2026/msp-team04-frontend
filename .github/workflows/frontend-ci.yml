name: Frontend CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  frontend-lint-typecheck:
    name: Frontend - Install & Typecheck & Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      EXPO_PUBLIC_API_BASE_URL: http://localhost:8080

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint check
        run: npx eslint .